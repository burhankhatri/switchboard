schema: spec-driven

context: |
  Switchboard — shared agent workspaces, derived from switchboard.
  A workspace is a folder in one private git repo carrying the skills, scripts
  and connections for one kind of work. A run spawns a Daytona sandbox,
  sparse-clones that folder, and starts a headless agent with cwd inside it.

  Stack: TypeScript, Next.js 16 (App Router), Prisma 7 + Neon Postgres,
  NextAuth v4 (GitHub OAuth, JWT sessions), Tailwind 4, Daytona SDK,
  Claude Code CLI headless. npm workspaces monorepo.

  Conventions:
  - Conventional commits. Commit messages explain WHY, not what.
  - Comments explain reasoning and non-obvious constraints, never narrate code.
  - Read AGENTS.md before running anything; it lists the pre-existing type
    errors and the traps.
  - Security-relevant changes to workspace connections must keep the
    membership checks at BOTH bind time and run time.

